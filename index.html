
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заявка на підключення інтернету | Стар Телеком</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container svg {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            background-color: #fff;
            color: #222;
        }

        input:focus {
            border-color: #0088cc;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 136, 204, 0.12);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #006699;
        }

        button:disabled {
            background-color: #8bbbd3;
            cursor: wait;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: #218838;
        }

        .error {
            color: #dc3545;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Логотип Стар Телеком -->
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 500 160"
             width="100%"
             height="100%"
             role="img"
             aria-label="Стар Телеком">

            <style>
                .b2-title {
                    font-family: sans-serif;
                    font-weight: 800;
                    font-size: 32px;
                    fill: #0088cc;
                    letter-spacing: 1px;
                }

                .b2-subtitle {
                    font-family: sans-serif;
                    font-weight: 600;
                    font-size: 14px;
                    fill: #0088cc;
                    letter-spacing: 3px;
                }
            </style>

            <g transform="translate(10, 15)">
                <path
                    d="M 60 0 L 85 70 L 160 70 L 100 115
                       L 125 185 L 60 140 L -5 185 L 20 115
                       L -40 70 L 35 70 Z"
                    fill="#0088cc"
                    opacity="0.2"
                    transform="scale(0.7) translate(15,15)"
                />

                <g fill="none"
                   stroke-width="6"
                   stroke-linecap="round">

                    <path d="M 60 10 L 75 55 L 115 60"
                          stroke="#0088cc"/>

                    <path d="M 115 60 L 85 85 L 95 125"
                          stroke="#facc15"
                          stroke-width="5"/>

                    <path d="M 95 125 L 60 105 L 25 125"
                          stroke="#0088cc"/>

                    <path d="M 25 125 L 35 85 L 5 60"
                          stroke="#facc15"
                          stroke-width="5"/>

                    <path d="M 5 60 L 45 55 L 60 10"
                          stroke="#0088cc"/>
                </g>
            </g>

            <g transform="translate(160, 0)">
                <text x="0" y="70" class="b2-title">
                    СТАР ТЕЛЕКОМ
                </text>

                <text x="2" y="105" class="b2-subtitle">
                    ІНТЕРНЕТ ДЛЯ ВСІХ
                </text>
            </g>
        </svg>
    </div>

    <h2>Підключення інтернету</h2>

    <form id="internetForm">
        <div class="form-group">
            <label for="scanLocation">Місце сканування QR-коду:</label>

            <input
                type="text"
                id="scanLocation"
                name="scanLocation"
                list="scanLocations"
                required
                maxlength="200"
                autocomplete="off"
                placeholder="Почніть вводити адресу..."
    >

            <datalist id="scanLocations">
                <option value="Шевченка 20"></option>
                <option value="Адреса 2"></option>
                <option value="Адреса 3"></option>
            </datalist>
    </div>

        <div class="form-group">
            <label for="name">Ваше ім'я:</label>

            <input
                type="text"
                id="name"
                name="name"
                required
                maxlength="100"
                autocomplete="name"
                placeholder="Іван"
            >
        </div>

        <div class="form-group">
            <label for="phone">Номер телефону:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                required
                value="+38 (0"
                placeholder="+38 (095) 073-84-26"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="19"
                aria-describedby="phoneHelp"
            >

            <small id="phoneHelp"
                   style="display:block; margin-top:6px; color:#777;">
                Введіть 9 цифр номера після +38 (0
            </small>
        </div>

        <div class="form-group">
            <label for="address">Адреса підключення:</label>

            <input
                type="text"
                id="address"
                name="address"
                required
                maxlength="250"
                autocomplete="street-address"
                placeholder="вул. Шевченка, 10, кв. 5"
            >
        </div>

        <button type="submit" id="submitButton">
            Відправити заявку
        </button>

        <div id="status" role="status" aria-live="polite"></div>

    </form>
</div>

<script>
(function () {
    "use strict";

    const phoneInput = document.getElementById("phone");
    const form = document.getElementById("internetForm");
    const statusDiv = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    // Постійний префікс номера
    const PREFIX = "+38 (0";

    // Максимум цифр після нуля в префіксі
    const MAX_DIGITS = 9;

    // Зберігаємо тільки цифри номера після +38 (0
    let phoneDigits = "";

    // Перетворення цифр у формат +38 (095) 123-45-67
    function formatPhone(digits) {
        let result = PREFIX;

        if (digits.length > 0) {
            result += digits.slice(0, 2);
        }

        if (digits.length > 2) {
            result += ") " + digits.slice(2, 5);
        }

        if (digits.length > 5) {
            result += "-" + digits.slice(5, 7);
        }

        if (digits.length > 7) {
            result += "-" + digits.slice(7, 9);
        }

        return result;
    }

    // Нормалізація номера, введеного або вставленого користувачем
    function extractPhoneDigits(value) {
        let digits = String(value).replace(/\D/g, "");

        // Якщо введений повний номер України: 380XXXXXXXXX
        if (digits.startsWith("380")) {
            digits = digits.slice(3);
        } else if (digits.startsWith("38") && digits.length > 9) {
            digits = digits.slice(2);
        }

        // Нуль уже міститься в постійному префіксі
        if (digits.startsWith("0")) {
            digits = digits.slice(1);
        }

        return digits.slice(0, MAX_DIGITS);
    }

    // Позиція курсора не може бути всередині префікса
    function moveCursorToEnd() {
        const position = phoneInput.value.length;

        try {
            phoneInput.setSelectionRange(position, position);
        } catch (_) {
            // Деякі браузери можуть не підтримувати цю операцію
        }
    }

    // Встановлення форматованого номера
    function updatePhone() {
        phoneInput.value = formatPhone(phoneDigits);
    }

    // Початковий стан
    phoneInput.value = PREFIX;
    phoneDigits = "";

    // Не даємо редагувати префікс клавішами
    phoneInput.addEventListener("keydown", function (event) {
        const start = phoneInput.selectionStart;
        const end = phoneInput.selectionEnd;

        const isDeletion =
            event.key === "Backspace" ||
            event.key === "Delete";

        if (
            isDeletion &&
            start === end &&
            (
                (event.key === "Backspace" && start <= PREFIX.length) ||
                (event.key === "Delete" && start < PREFIX.length)
            )
        ) {
            event.preventDefault();
            moveCursorToEnd();
            return;
        }

        // При введенні цифр усередині префікса переносимо курсор
        if (
            event.key.length === 1 &&
            !event.ctrlKey &&
            !event.metaKey &&
            !event.altKey &&
            start < PREFIX.length
        ) {
            event.preventDefault();
            moveCursorToEnd();
        }
    });

    // Забороняємо видалення частини префікса через beforeinput
    phoneInput.addEventListener("beforeinput", function (event) {
        const start = phoneInput.selectionStart;
        const end = phoneInput.selectionEnd;

        if (
            event.inputType &&
            event.inputType.startsWith("delete") &&
            start < PREFIX.length &&
            end <= PREFIX.length
        ) {
            event.preventDefault();
            moveCursorToEnd();
        }
    });

    // Обработка ввода и вставки номера
    phoneInput.addEventListener("input", function () {
        const currentValue = phoneInput.value;

        // Если поле заменили целиком, восстановим префикс
        if (!currentValue.startsWith(PREFIX)) {
            phoneDigits = extractPhoneDigits(currentValue);
        } else {
            phoneDigits = extractPhoneDigits(
                currentValue.slice(PREFIX.length)
            );
        }

        updatePhone();
        moveCursorToEnd();
    });

    // Не разрешаем поставить курсор внутрь префикса
    phoneInput.addEventListener("click", function () {
        if (phoneInput.selectionStart < PREFIX.length) {
            moveCursorToEnd();
        }
    });

    phoneInput.addEventListener("focus", function () {
        if (phoneInput.selectionStart < PREFIX.length) {
            moveCursorToEnd();
        }
    });

    // Поддержка вставки полного номера из буфера обмена
    phoneInput.addEventListener("paste", function (event) {
        event.preventDefault();

        const clipboardText =
            event.clipboardData.getData("text");

        phoneDigits = extractPhoneDigits(clipboardText);

        updatePhone();
        moveCursorToEnd();
    });

    // Проверка номера перед отправкой
    function isPhoneComplete() {
        return phoneDigits.length === MAX_DIGITS;
    }

    // Отправка заявки через Netlify Function
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        statusDiv.textContent = "";
        statusDiv.className = "";

        const name = document.getElementById("name").value.trim();
        const address = document.getElementById("address").value.trim();
        const scanLocation = document.getElementById("scanLocation").value.trim();
        const phone = formatPhone(phoneDigits);

        if (!name || !address || !scanLocation) {
            statusDiv.textContent =
                "Заповніть, будь ласка, всі поля.";
            statusDiv.className = "error";
            return;
        }

        if (!isPhoneComplete()) {
            statusDiv.textContent =
                "Введіть повний номер телефону з 9 цифр після +38 (0.";
            statusDiv.className = "error";
            phoneInput.focus();
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Надсилання...";
        statusDiv.textContent = "Надсилання заявки...";

        try {
            const response = await fetch(
                "/.netlify/functions/send",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        address: address
                        scanLocation: scanLocation
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch (_) {
                throw new Error("Сервер повернув некоректну відповідь.");
            }

            if (!response.ok || !data.success) {
                throw new Error(
                    data.message || "Не вдалося відправити заявку."
                );
            }

            statusDiv.textContent =
                "Заявку успішно надіслано! Скоро ми зв'яжемося з Вами.";
            statusDiv.className = "success";

            form.reset();

            phoneDigits = "";
            phoneInput.value = PREFIX;

        } catch (error) {
            console.error("Помилка відправлення:", error);

            statusDiv.textContent =
                "Помилка відправлення. Спробуйте ще раз.";
            statusDiv.className = "error";

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Відправити заявку";
        }
    });
})();
</script>

</body>
</html>
