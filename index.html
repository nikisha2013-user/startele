<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на подключение интернета | Стар Телеком</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-container svg {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0088cc;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <!-- Блок логотипа прямо в коде страницы -->
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
          <style>
            .b2-title { font-family: sans-serif; font-weight: 800; font-size: 32px; fill: #0088cc; letter-spacing: 1px; }
            .b2-subtitle { font-family: sans-serif; font-weight: 600; font-size: 14px; fill: #0088cc; letter-spacing: 3px; }
          </style>
          <g transform="translate(10, 15)">
            <path d="M 60 0 L 85 70 L 160 70 L 100 115 L 125 185 L 60 140 L -5 185 L 20 115 L -40 70 L 35 70 Z" fill="#0088cc" opacity="0.2" transform="scale(0.7) translate(15,15)" />
            <g fill="none" stroke-width="6" stroke-linecap="round">
              <path d="M 60 10 L 75 55 L 115 60" stroke="#0088cc" />
              <path d="M 115 60 L 85 85 L 95 125" stroke="#facc15" stroke-width="5" />
              <path d="M 95 125 L 60 105 L 25 125" stroke="#0088cc" />
              <path d="M 25 125 L 35 85 L 5 60" stroke="#facc15" stroke-width="5" />
              <path d="M 5 60 L 45 55 L 60 10" stroke="#0088cc" />
            </g>
          </g>
          <g transform="translate(160, 0)">
            <text x="0" y="70" class="b2-title">СТАР ТЕЛЕКОМ</text>
            <text x="2" y="105" class="b2-subtitle">ІНТЕРНЕТ ДЛЯ ВСІХ</text>
          </g>
        </svg>
    </div>

    <h2>Підключеня интернету</h2>
    
    <form id="internetForm">
        <div class="form-group">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" required placeholder="Иван">
        </div>
        <div class="form-group">
            <label for="phone">Номер телефону:</label>
            <input type="tel" id="phone" required value="+38 (0" placeholder="+38 (099) 123-45-67">
        </div>
        <div class="form-group">
            <label for="address">Адреса підключеня:</label>
            <input type="text" id="address" required placeholder="ул. Шевченко, 10, кв. 5">
        </div>
        <button type="submit">ОК (Отправить)</button>
        <div id="status"></div>
    </form>
</div>

<script>
    const phoneInput = document.getElementById('phone');

    // Маска ввода телефона
    phoneInput.addEventListener('input', function () {
        let value = phoneInput.value;
        const prefix = '+38 (0';
        
        if (!value.startsWith(prefix)) {
            value = prefix;
        }

        let numbers = value.slice(prefix.length).replace(/\D/g, '');
        if (numbers.length > 9) {
            numbers = numbers.slice(0, 9);
        }

        let formatted = prefix;
        if (numbers.length > 0) {
            formatted += numbers.substring(0, 2);
        }
        if (numbers.length > 2) {
            formatted += ') ' + numbers.substring(2, 5);
        }
        if (numbers.length > 5) {
            formatted += '-' + numbers.substring(5, 7);
        }
        if (numbers.length > 7) {
            formatted += '-' + numbers.substring(7, 9);
        }

        phoneInput.value = formatted;
    });

    phoneInput.addEventListener('click', function () {
        if (phoneInput.selectionStart < 6) {
            phoneInput.setSelectionRange(phoneInput.value.length, phoneInput.value.length);
        }
    });

    // Отправка формы
    document.getElementById('internetForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const statusDiv = document.getElementById('status');

        statusDiv.textContent = 'Отправка...';
        statusDiv.className = '';

        fetch('/.netlify/functions/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, address })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                statusDiv.textContent = 'Заявка успешно отправлена! Скоро мы с вами свяжемся.';
                statusDiv.className = 'success';
                document.getElementById('internetForm').reset();
                phoneInput.value = '+38 (0';
            } else {
                statusDiv.textContent = 'Ошибка отправки. Попробуйте еще раз.';
                statusDiv.className = 'error';
            }
        })
        .catch(error => {
            statusDiv.textContent = 'Ошибка сети. Проверьте подключение.';
            statusDiv.className = 'error';
        });
    });
</script>

</body>
</html>
