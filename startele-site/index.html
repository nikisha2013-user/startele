<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на подключение интернета</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0088cc;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>Подключение интернета</h2>
    <form id="internetForm">
        <div class="form-group">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" required placeholder="Иван">
        </div>
        <div class="form-group">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" required placeholder="+38 (099) 123-45-67">
        </div>
        <div class="form-group">
            <label for="address">Адрес подключения:</label>
            <input type="text" id="address" required placeholder="ул. Шевченко, 10, кв. 5">
        </div>
        <button type="submit">ОК (Отправить)</button>
        <div id="status"></div>
    </form>
</div>

<script>
    // Вставьте сюда ваши данные бота
    const BOT_TOKEN = 'YOUR_BOT_TOKEN';
    const CHAT_ID = 'YOUR_CHAT_ID';

    document.getElementById('internetForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const statusDiv = document.getElementById('status');

        // Формируем текст сообщения для Telegram
        const message = `🌐 **Новая заявка на интернет!**\n\n👤 **Имя:** ${name}\n📞 **Телефон:** ${phone}\n📍 **Адрес:** ${address}`;

        statusDiv.textContent = 'Отправка...';
        statusDiv.className = '';

        // Отправка данных через Telegram Bot API
        fetch('/.netlify/functions/send', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ name, phone, address })
		})
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                statusDiv.textContent = 'Заявка успешно отправлена! Скоро мы с вами свяжемся.';
                statusDiv.className = 'success';
                document.getElementById('internetForm').reset();
            } else {
                statusDiv.textContent = 'Ошибка отправки. Попробуйте еще раз.';
                statusDiv.className = 'error';
            }
        })
        .catch(error => {
            statusDiv.textContent = 'Ошибка сети. Проверьте подключение.';
            statusDiv.className = 'error';
        });
    });
</script>

</body>
</html>
