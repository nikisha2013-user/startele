<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Градиенты для сияющей звезды и элементов связи -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Стили текста и элементов -->
  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #38bdf8; /* Тот же цвет, что и у слогана */
      letter-spacing: 1px;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 3px;
    }
  </style>

  <!-- Иконка звезды с коммуникационной сеткой -->
  <g transform="translate(10, 0)">
    <!-- Фоновый круг / сияние -->
    <circle cx="75" cy="80" r="65" fill="#0f172a" opacity="0.6" stroke="#1e293b" stroke-width="2" />
    <circle cx="75" cy="80" r="55" fill="none" stroke="url(#starGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Лучи / линии связи внутри звезды -->
    <g filter="url(#glow)">
      <!-- Внешний контур звезды -->
      <polygon points="75,20 93,58 135,64 105,94 112,136 75,116 38,136 45,94 15,64 57,58" fill="none" stroke="url(#starGrad)" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Внутренние сетевые линии -->
      <line x1="75" y1="80" x2="75" y2="20" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="75" y1="80" x2="135" y2="64" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="75" y1="80" x2="112" y2="136" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="75" y1="80" x2="38" y2="136" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="75" y1="80" x2="15" y2="64" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      
      <line x1="93" y1="58" x2="57" y2="58" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
      <line x1="57" y1="58" x2="75" y2="116" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
      <line x1="75" y1="116" x2="93" y2="58" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

      <!-- Узловые точки (сервера/клиенты) -->
      <circle cx="75" cy="20" r="3.5" fill="#facc15" />
      <circle cx="135" cy="64" r="3.5" fill="#38bdf8" />
      <circle cx="112" cy="136" r="3.5" fill="#38bdf8" />
      <circle cx="38" cy="136" r="3.5" fill="#38bdf8" />
      <circle cx="15" cy="64" r="3.5" fill="#facc15" />
      <circle cx="75" cy="80" r="5" fill="#facc15" />
      <circle cx="93" cy="58" r="3" fill="#facc15" />
      <circle cx="57" cy="58" r="3" fill="#38bdf8" />
      <circle cx="105" cy="94" r="3" fill="#38bdf8" />
      <circle cx="45" cy="94" r="3" fill="#facc15" />
    </g>

    <!-- Динамическая волна / сигнал передачи данных -->
    <path d="M 20 100 Q 50 130 90 110 T 140 70" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Текстовый блок логотипа -->
  <g transform="translate(160, 0)">
    <text x="0" y="70" class="brand-title">СТАР ТЕЛЕКОМ</text>
    <text x="2" y="105" class="brand-subtitle">ІНТЕРНЕТ ДЛЯ ВСІХ</text>
  </g>
</svg>